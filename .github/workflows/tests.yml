name: Proton Mail UI tests

on:
  pull_request:          # quick smoke set (5 tests)
  schedule:
    - cron: '0 2 * * *'  # nightly full regression
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # credentials come from repository secrets, ConfigReader reads env variables first
      PROTON_USERNAME: ${{ secrets.PROTON_USERNAME }}
      PROTON_PASSWORD: ${{ secrets.PROTON_PASSWORD }}
      PROTON_EMAIL: ${{ secrets.PROTON_EMAIL }}
      PROTON_RECIPIENT: ${{ secrets.PROTON_RECIPIENT }}
      PROTON_RECIPIENT_USERNAME: ${{ secrets.PROTON_RECIPIENT_USERNAME }}
      PROTON_RECIPIENT_PASSWORD: ${{ secrets.PROTON_RECIPIENT_PASSWORD }}
      PROTON_INCORRECTPWD: ${{ secrets.PROTON_INCORRECTPWD }}
      PROTON_LABEL: ${{ vars.PROTON_LABEL || 'p' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: browser-actions/setup-chrome@v1

      - name: Smoke tests (pull request)
        if: github.event_name == 'pull_request'
        run: mvn -B test -Dgroups=smoke -Dheadless=true

      - name: Full regression (nightly / manual)
        if: github.event_name != 'pull_request'
        run: mvn -B test -Dgroups=regression -Dheadless=true

      - name: HTML report
        if: always()
        run: mvn -B surefire-report:report-only

      - name: Upload report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            target/site/surefire-report.html
            target/surefire-reports/
            reports/

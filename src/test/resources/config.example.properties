# Copy this file to config.properties (git-ignored) and fill in your test accounts.
# Every key can also come from an environment variable: proton.password -> PROTON_PASSWORD (used in CI).

proton.url=https://account.proton.me/mail

# account 1: sender, also receives its own mails
proton.username=your_proton_username
proton.password=your_proton_password
proton.email=your_proton_username@proton.me
# a wrong password for the negative login test
proton.incorrectPwd=wrong-password-123
# an existing label in account 1
proton.label=p

# account 2: receiver, only needed for TwoAccountTest (test is skipped when the password is empty)
proton.recipient=second_account@proton.me
proton.recipient.username=second_account_username
proton.recipient.password=
